<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="f1 by window, on 86 signals the sweep never saw">
<style>
:root { --accent: #2a78d6; --wash: rgba(42,120,214,0.12); --rest: #c3c2b7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; }
@media (prefers-color-scheme: dark) { :root { --accent: #3987e5; --wash: rgba(57,135,229,0.18); --rest: #5f5e5a; --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; } }
text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: var(--ink2); font-size: 12px; }
.title { fill: var(--ink); font-size: 16px; font-weight: 600; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.value { fill: var(--ink); font-variant-numeric: tabular-nums; }
.grid { stroke: var(--grid); stroke-width: 1; } .axis { stroke: var(--axis); stroke-width: 1; }
.bar { fill: var(--accent); } .rest { fill: var(--rest); } .band { fill: var(--wash); }
.line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; } .bg { fill: var(--surface); }
.mark { stroke: var(--muted); stroke-width: 1; }
</style>
