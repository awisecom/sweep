<svg xmlns="http://www.w3.org/2000/svg" width="760" height="438" viewBox="0 0 760 438" role="img" aria-label="What explains the variance in f1">
<style>
:root { --accent: #2a78d6; --wash: rgba(42,120,214,0.12); --rest: #c3c2b7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; }
